name: Build Signed iOS App

on:
  workflow_dispatch:
    inputs:
      certificate_password:
        description: 'Certificate password (will be masked)'
        required: true
        type: string
      provisioning_profile_name:
        description: 'Provisioning profile name'
        required: true
        type: string

jobs:
  build-signed-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.1'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Generate app icons
      run: flutter pub run flutter_launcher_icons:main
      
    - name: Install CocoaPods
      run: |
        cd ios
        pod install
        
    - name: Import Certificate and Provisioning Profile
      run: |
        # Create keychain
        security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        
        # Import certificate
        echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > certificate.p12
        security import certificate.p12 -k build.keychain -P "${{ github.event.inputs.certificate_password }}" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
        
        # Import provisioning profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/${{ github.event.inputs.provisioning_profile_name }}.mobileprovision
        
    - name: Build iOS with Code Signing
      run: |
        flutter build ios --release \
          --export-options-plist=ios/ExportOptions.plist
          
    - name: Create Signed IPA
      run: |
        xcodebuild -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath build/ios/Runner.xcarchive \
          archive
          
        xcodebuild -exportArchive \
          -archivePath build/ios/Runner.xcarchive \
          -exportPath build/ios/ipa \
          -exportOptionsPlist ios/ExportOptions.plist
          
    - name: Upload Signed IPA
      uses: actions/upload-artifact@v3
      with:
        name: petapp-signed-ipa
        path: build/ios/ipa/*.ipa
        
    - name: Upload to TestFlight (Optional)
      if: github.ref == 'refs/heads/main'
      run: |
        xcrun altool --upload-app \
          --type ios \
          --file build/ios/ipa/*.ipa \
          --username "${{ secrets.APPLE_ID }}" \
          --password "${{ secrets.APP_SPECIFIC_PASSWORD }}"
