<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pet Model Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="loading">Loading 3D Model...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

    <script>
        let scene, camera, renderer, controls, model;
        let meshes = [];
        let selectedMesh = null;
        let originalMaterials = new Map();

        // Initialize Three.js scene
        function initScene(backgroundColor) {
            const container = document.getElementById('canvas-container');
            
            // Scene
            scene = new THREE.Scene();
            const bgColor = backgroundColor || '#1a1a1a';
            scene.background = new THREE.Color(bgColor);

            // Camera - centered on model
            camera = new THREE.PerspectiveCamera(
                45,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(0, 1, 3); // Centered vertically

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight1.position.set(5, 10, 5);
            directionalLight1.castShadow = true;
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight2.position.set(-5, 5, -5);
            scene.add(directionalLight2);

            // Controls - DISABLED for fixed model
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enabled = false; // Disable all user controls
            controls.enableRotate = false;
            controls.enableZoom = false;
            controls.enablePan = false;
            controls.target.set(0, 0, 0); // Center target
            controls.update();

            // Raycaster for mesh interaction
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            renderer.domElement.addEventListener('click', (event) => {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(meshes, true);

                if (intersects.length > 0) {
                    const clickedMesh = intersects[0].object;
                    onMeshClicked(clickedMesh);
                }
            });

            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            animate();
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Load model from base64 data URL (supports both GLB and OBJ)
        function loadModel(dataUrl, fileType = 'glb') {
            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');

            try {
                // Extract base64 data from data URL
                const base64Data = dataUrl.split(',')[1];
                
                // Convert base64 to binary
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                // Determine file type and mime type
                const isOBJ = fileType.toLowerCase() === 'obj';
                const mimeType = isOBJ ? 'text/plain' : 'model/gltf-binary';
                
                // Create blob and URL
                const blob = new Blob([bytes], { type: mimeType });
                const blobUrl = URL.createObjectURL(blob);

                // Process loaded model
                const processModel = (loadedModel) => {
                    model = loadedModel;
                    
                    // Clean up blob URL
                    URL.revokeObjectURL(blobUrl);
                    
                    // Center and scale the model
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 2 / maxDim;
                    model.scale.multiplyScalar(scale);
                    
                    // Center the model at origin (0, 0, 0)
                    model.position.sub(center.multiplyScalar(scale));

                    // Collect all meshes and remove materials (show basic geometry)
                    meshes = [];
                    model.traverse((child) => {
                        if (child.isMesh) {
                            meshes.push(child);
                            // Store original for reference
                            originalMaterials.set(child, child.material.clone());
                            // Replace with basic material - medium gray
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0x808080,
                                flatShading: true,
                                roughness: 1.0,
                                metalness: 0.0
                            });
                        }
                    });

                    scene.add(model);
                    loading.classList.add('hidden');

                    // Send mesh names to Flutter
                    const meshNames = meshes.map(m => m.name).filter(n => n);
                    sendMessageToFlutter('meshesDetected', { meshes: meshNames });
                    sendMessageToFlutter('modelLoaded', { success: true });
                };

                if (isOBJ) {
                    // Load OBJ file
                    const loader = new THREE.OBJLoader();
                    loader.load(
                        blobUrl,
                        (obj) => {
                            processModel(obj);
                        },
                        (progress) => {
                            const percent = (progress.loaded / progress.total * 100).toFixed(0);
                            loading.textContent = `Loading: ${percent}%`;
                        },
                        (error) => {
                            console.error('Error loading OBJ model:', error);
                            loading.textContent = 'Error loading model';
                            sendMessageToFlutter('modelLoaded', { success: false, error: error.message });
                            URL.revokeObjectURL(blobUrl);
                        }
                    );
                } else {
                    // Load GLB file
                    const loader = new THREE.GLTFLoader();
                    loader.load(
                        blobUrl,
                        (gltf) => {
                            processModel(gltf.scene);
                        },
                        (progress) => {
                            const percent = (progress.loaded / progress.total * 100).toFixed(0);
                            loading.textContent = `Loading: ${percent}%`;
                        },
                        (error) => {
                            console.error('Error loading GLB model:', error);
                            loading.textContent = 'Error loading model';
                            sendMessageToFlutter('modelLoaded', { success: false, error: error.message });
                            URL.revokeObjectURL(blobUrl);
                        }
                    );
                }
            } catch (error) {
                console.error('Error processing model data:', error);
                loading.textContent = 'Error processing model';
                sendMessageToFlutter('modelLoaded', { success: false, error: error.message });
            }
        }

        // Handle mesh click
        function onMeshClicked(mesh) {
            // Reset previous selection to basic material - medium gray
            if (selectedMesh) {
                selectedMesh.material = new THREE.MeshStandardMaterial({
                    color: 0x808080,
                    flatShading: true,
                    roughness: 1.0,
                    metalness: 0.0
                });
            }

            // Highlight new selection
            selectedMesh = mesh;
            const highlightMaterial = new THREE.MeshStandardMaterial({
                color: 0xff6b35,
                emissive: 0xff6b35,
                emissiveIntensity: 0.5,
                flatShading: true,
                roughness: 1.0,
                metalness: 0.0
            });
            mesh.material = highlightMaterial;

            // Send to Flutter
            sendMessageToFlutter('meshClicked', {
                name: mesh.name || 'unnamed',
                position: {
                    x: mesh.position.x,
                    y: mesh.position.y,
                    z: mesh.position.z
                }
            });
        }

        // Highlight specific mesh by name
        function highlightMesh(meshName) {
            const mesh = meshes.find(m => m.name === meshName);
            if (mesh) {
                onMeshClicked(mesh);
            }
        }

        // Clear all highlights
        function clearHighlights() {
            if (selectedMesh) {
                // Reset to basic material - medium gray
                selectedMesh.material = new THREE.MeshStandardMaterial({
                    color: 0x808080,
                    flatShading: true,
                    roughness: 1.0,
                    metalness: 0.0
                });
                selectedMesh = null;
            }
        }

        // Get list of all mesh names
        function getMeshNames() {
            const names = meshes.map(m => m.name).filter(n => n);
            sendMessageToFlutter('meshNames', { names: names });
        }

        // Send message to Flutter
        function sendMessageToFlutter(type, data) {
            if (window.FlutterChannel) {
                window.FlutterChannel.postMessage(JSON.stringify({ type, data }));
            }
        }

        // Listen for messages from Flutter
        window.addEventListener('message', (event) => {
            try {
                const message = JSON.parse(event.data);
                handleFlutterMessage(message);
            } catch (e) {
                console.error('Error parsing message:', e);
            }
        });

        function handleFlutterMessage(message) {
            switch (message.action) {
                case 'init':
                    initScene(message.backgroundColor);
                    break;
                case 'loadModel':
                    loadModel(message.dataUrl, message.fileType || 'glb');
                    break;
                case 'highlightMesh':
                    highlightMesh(message.meshName);
                    break;
                case 'clearHighlights':
                    clearHighlights();
                    break;
                case 'getMeshNames':
                    getMeshNames();
                    break;
                case 'rotateModel':
                    if (model) {
                        model.rotation.y += (message.angle || 90) * Math.PI / 180;
                    }
                    break;
            }
        }
    </script>
</body>
</html>
