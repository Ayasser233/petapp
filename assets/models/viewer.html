<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pet Model Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            touch-action: none; /* Prevent default touch behaviors */
            user-select: none; /* Prevent text selection */
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        canvas {
            touch-action: none; /* Prevent default touch behaviors on canvas */
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
<div id="canvas-container">
    <div id="loading">Loading 3D Model...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

<script>
    let scene, camera, renderer, model, modelContainer;
    let meshes = [];
    let selectedMesh = null;
    let originalMaterials = new Map();

    // Zoom variables - global scope
    const minZoom = 1.5;  // Closer zoom in
    const maxZoom = 10;   // Further zoom out
    let currentZoom = 4; // Initial camera distance
    let targetZoom = 4;  // For smooth zoom animation

    // Touch gesture variables - global scope
    let isDragging = false;
    let previousTouchX = 0;
    let previousTouchY = 0;
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;
    let initialPinchDistance = 0;
    let isPinching = false;
    let lastPinchScale = 1;
    let pinchStartZoom = 4; // Store zoom level when pinch starts

    // Raycaster for mesh interaction - global scope
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let clickStartX = 0;
    let clickStartY = 0;
    let clickStartTime = 0;

    // Get distance between two touch points
    function getTouchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // Initialize Three.js scene
    function initScene(backgroundColor) {
        const container = document.getElementById('canvas-container');

        // Scene
        scene = new THREE.Scene();
        const bgColor = backgroundColor || '#1a1a1a';
        scene.background = new THREE.Color(bgColor);

        // Camera - positioned to view model from front
        camera = new THREE.PerspectiveCamera(
            45,
            container.clientWidth / container.clientHeight,
            0.1,
            1000
        );
        camera.position.set(0, 0, 4); // Further back to see full model
        camera.lookAt(0, 0, 0); // Look at origin

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.domElement.style.touchAction = 'none'; // Important for touch gestures
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight1.position.set(5, 10, 5);
        directionalLight1.castShadow = true;
        scene.add(directionalLight1);

        const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
        directionalLight2.position.set(-5, 5, -5);
        scene.add(directionalLight2);

        // Mouse click tracking (for selection only, no rotation)
        renderer.domElement.addEventListener('mousedown', (event) => {
            clickStartX = event.clientX;
            clickStartY = event.clientY;
            clickStartTime = Date.now();
        });

        // Mouse wheel zoom - improved sensitivity
        renderer.domElement.addEventListener('wheel', (event) => {
            event.preventDefault();

            // Better zoom speed based on current zoom level
            const zoomSpeed = currentZoom * 0.0015;
            const delta = event.deltaY * -zoomSpeed;

            targetZoom += delta;
            targetZoom = Math.max(minZoom, Math.min(maxZoom, targetZoom));
        }, { passive: false });

        // Click for mesh selection (only if not dragging)
        renderer.domElement.addEventListener('click', (event) => {
            // Only trigger click if mouse didn't move much (not a drag) and was quick
            const deltaX = Math.abs(event.clientX - clickStartX);
            const deltaY = Math.abs(event.clientY - clickStartY);
            const deltaTime = Date.now() - clickStartTime;

            // Allow slightly more movement but still detect as click if quick
            if (deltaX < 10 && deltaY < 10 && deltaTime < 300) {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(meshes, true);

                if (intersects.length > 0) {
                    const clickedMesh = intersects[0].object;
                    onMeshClicked(clickedMesh);
                }
            }
        });

        // Touch support for mobile - event listeners only
        renderer.domElement.addEventListener('touchstart', (event) => {
            if (event.touches.length === 1) {
                isDragging = true;
                isPinching = false;
                previousTouchX = event.touches[0].clientX;
                previousTouchY = event.touches[0].clientY;
                touchStartX = event.touches[0].clientX;
                touchStartY = event.touches[0].clientY;
                touchStartTime = Date.now();
                event.preventDefault();
            } else if (event.touches.length === 2) {
                // Start pinch zoom
                isDragging = false;
                isPinching = true;
                initialPinchDistance = getTouchDistance(event.touches);
                pinchStartZoom = currentZoom; // Save current zoom level
                lastPinchScale = 1;
                event.preventDefault();
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchmove', (event) => {
            if (event.touches.length === 1 && isDragging && !isPinching) {
                // Check if model is loaded before rotating
                if (modelContainer) {
                    const deltaX = event.touches[0].clientX - previousTouchX;
                    const deltaY = event.touches[0].clientY - previousTouchY;

                    // Rotate around Y-axis (horizontal swipe) - increased sensitivity
                    modelContainer.rotation.y += deltaX * 0.02;

                    // Rotate around X-axis (vertical swipe) for more control
                    modelContainer.rotation.x += deltaY * 0.015;

                    // Clamp X rotation to prevent flipping
                    modelContainer.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, modelContainer.rotation.x));

                    previousTouchX = event.touches[0].clientX;
                    previousTouchY = event.touches[0].clientY;
                } else {
                    console.log('Model not loaded yet, cannot rotate');
                }
                event.preventDefault();
            } else if (event.touches.length === 2 && isPinching) {
                // Pinch zoom with improved sensitivity
                const currentDistance = getTouchDistance(event.touches);

                // Calculate zoom based on distance ratio from initial pinch
                const distanceRatio = currentDistance / initialPinchDistance;

                // More intuitive zoom: spread fingers = zoom in (closer), pinch = zoom out (further)
                // Inverse relationship: larger distance = smaller zoom value (closer to model)
                targetZoom = pinchStartZoom / distanceRatio;
                targetZoom = Math.max(minZoom, Math.min(maxZoom, targetZoom));

                event.preventDefault();
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchend', (event) => {
            if (isPinching) {
                isPinching = false;
                event.preventDefault();
                return;
            }

            isDragging = false;

            // Check if it was a tap (not a swipe)
            if (event.changedTouches.length === 1) {
                const touch = event.changedTouches[0];
                const deltaX = Math.abs(touch.clientX - touchStartX);
                const deltaY = Math.abs(touch.clientY - touchStartY);
                const deltaTime = Date.now() - touchStartTime;

                // Allow slightly more movement for tap detection but require quick action
                if (deltaX < 15 && deltaY < 15 && deltaTime < 300) {
                    const rect = renderer.domElement.getBoundingClientRect();
                    mouse.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(meshes, true);

                    if (intersects.length > 0) {
                        const clickedMesh = intersects[0].object;
                        onMeshClicked(clickedMesh);
                    }
                }
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchcancel', () => {
            isDragging = false;
            isPinching = false;
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        animate();
    }

    // Animation loop
    function animate() {
        requestAnimationFrame(animate);

        // Smooth zoom animation
        if (Math.abs(currentZoom - targetZoom) > 0.01) {
            currentZoom += (targetZoom - currentZoom) * 0.1; // Lerp for smooth transition
            camera.position.z = currentZoom;
        }

        renderer.render(scene, camera);
    }

    // Load model from base64 data URL (supports both GLB and OBJ)
    function loadModel(dataUrl, fileType = 'glb') {
        const loading = document.getElementById('loading');
        loading.classList.remove('hidden');

        try {
            // Extract base64 data from data URL
            const base64Data = dataUrl.split(',')[1];

            // Convert base64 to binary
            const binaryString = atob(base64Data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            // Determine file type and mime type
            const isOBJ = fileType.toLowerCase() === 'obj';
            const mimeType = isOBJ ? 'text/plain' : 'model/gltf-binary';

            // Create blob and URL
            const blob = new Blob([bytes], { type: mimeType });
            const blobUrl = URL.createObjectURL(blob);

            // Process loaded model
            const processModel = (loadedModel) => {
                model = loadedModel;

                // Clean up blob URL
                URL.revokeObjectURL(blobUrl);

                // Calculate bounding box
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                // Scale model to fit in view (target size of 2 units)
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2 / maxDim;

                // Apply scale
                model.scale.set(scale, scale, scale);

                // After scaling, recalculate center
                const boxAfterScale = new THREE.Box3().setFromObject(model);
                const centerAfterScale = boxAfterScale.getCenter(new THREE.Vector3());

                // Position model so its center is at origin (0, 0, 0)
                model.position.set(
                    -centerAfterScale.x,
                    -centerAfterScale.y,
                    -centerAfterScale.z
                );

                // Collect all meshes and apply basic material
                meshes = [];
                model.traverse((child) => {
                    if (child.isMesh) {
                        meshes.push(child);
                        // Store original for reference
                        originalMaterials.set(child, child.material.clone());
                        // Replace with basic material - medium gray
                        child.material = new THREE.MeshStandardMaterial({
                            color: 0x808080,
                            flatShading: true,
                            roughness: 1.0,
                            metalness: 0.0
                        });
                    }
                });

                // Create container at origin - this will be rotated
                modelContainer = new THREE.Group();
                modelContainer.position.set(0, 0, 0);
                modelContainer.add(model);

                // Add container to scene
                scene.add(modelContainer);
                loading.classList.add('hidden');

                // Debug logging
                console.log('Model loaded and centered:');
                console.log('Model position:', model.position);
                console.log('Container position:', modelContainer.position);
                console.log('Model center (should be at origin):', centerAfterScale);

                // Send mesh names to Flutter
                const meshNames = meshes.map(m => m.name).filter(n => n);
                sendMessageToFlutter('meshesDetected', { meshes: meshNames });
                sendMessageToFlutter('modelLoaded', { success: true });
            };

            if (isOBJ) {
                // Load OBJ file
                const loader = new THREE.OBJLoader();
                loader.load(
                    blobUrl,
                    (obj) => {
                        processModel(obj);
                    },
                    (progress) => {
                        const percent = (progress.loaded / progress.total * 100).toFixed(0);
                        loading.textContent = `Loading: ${percent}%`;
                    },
                    (error) => {
                        console.error('Error loading OBJ model:', error);
                        loading.textContent = 'Error loading model';
                        sendMessageToFlutter('modelLoaded', { success: false, error: error.message });
                        URL.revokeObjectURL(blobUrl);
                    }
                );
            } else {
                // Load GLB file
                const loader = new THREE.GLTFLoader();
                loader.load(
                    blobUrl,
                    (gltf) => {
                        processModel(gltf.scene);
                    },
                    (progress) => {
                        const percent = (progress.loaded / progress.total * 100).toFixed(0);
                        loading.textContent = `Loading: ${percent}%`;
                    },
                    (error) => {
                        console.error('Error loading GLB model:', error);
                        loading.textContent = 'Error loading model';
                        sendMessageToFlutter('modelLoaded', { success: false, error: error.message });
                        URL.revokeObjectURL(blobUrl);
                    }
                );
            }
        } catch (error) {
            console.error('Error processing model data:', error);
            loading.textContent = 'Error processing model';
            sendMessageToFlutter('modelLoaded', { success: false, error: error.message });
        }
    }

    // Handle mesh click
    function onMeshClicked(mesh) {
        // Reset previous selection to basic material - medium gray
        if (selectedMesh) {
            selectedMesh.material = new THREE.MeshStandardMaterial({
                color: 0x808080,
                flatShading: true,
                roughness: 1.0,
                metalness: 0.0
            });
        }

        // Highlight new selection
        selectedMesh = mesh;
        const highlightMaterial = new THREE.MeshStandardMaterial({
            color: 0xff6b35,
            emissive: 0xff6b35,
            emissiveIntensity: 0.5,
            flatShading: true,
            roughness: 1.0,
            metalness: 0.0
        });
        mesh.material = highlightMaterial;

        // Send to Flutter
        sendMessageToFlutter('meshClicked', {
            name: mesh.name || 'unnamed',
            position: {
                x: mesh.position.x,
                y: mesh.position.y,
                z: mesh.position.z
            }
        });
    }

    // Highlight specific mesh by name
    function highlightMesh(meshName) {
        const mesh = meshes.find(m => m.name === meshName);
        if (mesh) {
            onMeshClicked(mesh);
        }
    }

    // Clear all highlights
    function clearHighlights() {
        if (selectedMesh) {
            // Reset to basic material - medium gray
            selectedMesh.material = new THREE.MeshStandardMaterial({
                color: 0x808080,
                flatShading: true,
                roughness: 1.0,
                metalness: 0.0
            });
            selectedMesh = null;
        }
    }

    // Get list of all mesh names
    function getMeshNames() {
        const names = meshes.map(m => m.name).filter(n => n);
        sendMessageToFlutter('meshNames', { names: names });
    }

    // Send message to Flutter
    function sendMessageToFlutter(type, data) {
        if (window.FlutterChannel) {
            window.FlutterChannel.postMessage(JSON.stringify({ type, data }));
        }
    }

    // Listen for messages from Flutter
    window.addEventListener('message', (event) => {
        try {
            const message = JSON.parse(event.data);
            handleFlutterMessage(message);
        } catch (e) {
            console.error('Error parsing message:', e);
        }
    });

    function handleFlutterMessage(message) {
        switch (message.action) {
            case 'init':
                initScene(message.backgroundColor);
                break;
            case 'loadModel':
                loadModel(message.dataUrl, message.fileType || 'glb');
                break;
            case 'highlightMesh':
                highlightMesh(message.meshName);
                break;
            case 'clearHighlights':
                clearHighlights();
                break;
            case 'getMeshNames':
                getMeshNames();
                break;
            case 'rotateModel':
                if (modelContainer) {
                    modelContainer.rotation.y += (message.angle || 90) * Math.PI / 180;
                }
                break;
            case 'zoom':
                if (message.direction === 'in') {
                    targetZoom = Math.max(minZoom, targetZoom - 0.5);
                } else if (message.direction === 'out') {
                    targetZoom = Math.min(maxZoom, targetZoom + 0.5);
                }
                break;
        }
    }
</script>
</body>
</html>
