allprojects {
    tasks.withType(JavaCompile) {
        options.compilerArgs << '-Xlint:-options'
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    // Force all plugins to use compileSdk 36
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdk 36

                defaultConfig {
                    minSdk 23  // Required for firebase-messaging 25.x
                }
            }
        }
    }
    
    // Fix for Facebook SDK resolution issues and API compatibility
    project.configurations.all {
        resolutionStrategy {
            force 'com.facebook.android:facebook-android-sdk:16.3.0'
            force 'com.facebook.android:facebook-core:16.3.0'
            force 'com.facebook.android:facebook-common:16.3.0'
            force 'com.facebook.android:facebook-login:16.3.0'
            force 'com.facebook.android:facebook-share:16.3.0'
            force 'com.facebook.android:facebook-applinks:16.3.0'
            force 'com.facebook.android:facebook-gamingservices:16.3.0'
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}