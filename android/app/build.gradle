plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Google Services plugin for Firebase
    id 'com.google.gms.google-services'
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "3"  // Incremented from 2 to 3
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.2"  // Updated version name
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.aleefy.petapp"
    compileSdk = 36  // Updated to API level 35 for Google Play requirement
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21  // Updated to Java 21 LTS
        targetCompatibility = JavaVersion.VERSION_21  // Updated to Java 21 LTS
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    
    kotlinOptions {
        jvmTarget = '21'  // Updated to Java 21 LTS
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.aleefy.petapp"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion  // Android 5.0 - widely supported
        targetSdk = 35  // Updated to API level 35 for Google Play requirement (December 2025)
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        
        // Add this for better compatibility
        multiDexEnabled = true
    }

    flavorDimensions = ["environment"]

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Aleefy Dev"
        }

        prod {
            dimension "environment"
            resValue "string", "app_name", "Aleefy"
        }
    }

    buildTypes {
        release {
            // Signing with release key
            signingConfig signingConfigs.release

            // Enable code shrinking, obfuscation, and optimization with R8
            minifyEnabled true
            shrinkResources true

            // ProGuard rules files
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {

    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'

    // MultiDex support
    implementation 'androidx.multidex:multidex:2.0.1'
}
