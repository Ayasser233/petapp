plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "11"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.10"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.aleefy.petapp"
    //noinspection GradleDependency
    compileSdk = 36
    ndkVersion = "29.0.14206865"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId = "com.aleefy.petapp"
        minSdkVersion 24  // Required for firebase-messaging 25.x and Flutter SDK support
        //noinspection OldTargetApi
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true

        // Enable 16 KB page size support
        manifestPlaceholders = [
                supportsFlexiblePageSizes: "true"
        ]

        // Note: abiFilters removed to avoid conflict with bundle splits
        // ABI selection is handled in bundle configuration below
    }

    flavorDimensions = ["environment"]

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Aleefy Dev"
        }

        prod {
            dimension "environment"
            resValue "string", "app_name", "Aleefy"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'FULL'
            }

            // Critical: Enable 16 KB page size support in native libraries
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                    cFlags "-Wl,-z,max-page-size=16384"
                    cppFlags "-Wl,-z,max-page-size=16384"
                }
            }
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    // Critical: Ensure native libraries are extracted for 16 KB support
    androidResources {
        noCompress 'tflite'
        noCompress 'lite'
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
            // Support 16 KB page sizes - arm64-v8a required, armeabi-v7a optional
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.activity:activity:1.13.0'
    implementation platform('com.google.firebase:firebase-bom:34.14.1')
    implementation 'com.google.firebase:firebase-analytics'
}